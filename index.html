<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NCS Catalog Explorer</title>
<style>
/* Layout: a sticky header, then three scrolling columns (sections | picture or list | details). Colour: a warm paper
   neutral, a teal accent for controls, eight topic hues (the validated categorical palette) that tint whatever belongs
   to a topic, and a fixed green / amber / red for "in the cleaned data / not / removed" that is always paired with text. */
:root {
  color-scheme: light;
  --bg: #fbfaf7; --panel: #ffffff; --pill: #f3f1ec; --chip: #efede7; --ink: #1d1d1b; --muted: #5f5e59;
  --line: #e4e2dc; --line-ui: #8a8982; --edge: #c9c7c0; --accent: #0b7285; --accent-soft: #e3f1f4;
  --ok: #256a42; --warn: #8a4f00; --bad: #b3261e;
  --f-cleaned: #1f8a4c; --f-dropped: #b8801f; --f-pii: #c43d3a;
  --c0: #9a988f; --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --tint: 12%; --tint-strong: 26%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #151514; --panel: #1e1e1c; --pill: #2a2927; --chip: #2d2c29; --ink: #ecebe6; --muted: #a9a8a1;
    --line: #34332f; --line-ui: #7d7c76; --edge: #5a5954; --accent: #5ec2d9; --accent-soft: #1f3a40;
    --ok: #6cc28f; --warn: #e0a35a; --bad: #f08a82;
    --f-cleaned: #4fae76; --f-dropped: #e8b86a; --f-pii: #e07068;
    --c0: #7a7973; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --tint: 22%; --tint-strong: 38%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #151514; --panel: #1e1e1c; --pill: #2a2927; --chip: #2d2c29; --ink: #ecebe6; --muted: #a9a8a1;
  --line: #34332f; --line-ui: #7d7c76; --edge: #5a5954; --accent: #5ec2d9; --accent-soft: #1f3a40;
  --ok: #6cc28f; --warn: #e0a35a; --bad: #f08a82;
  --f-cleaned: #4fae76; --f-dropped: #e8b86a; --f-pii: #e07068;
  --c0: #7a7973; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --tint: 22%; --tint-strong: 38%;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 20; background: var(--panel); color: var(--accent); padding: 6px 10px; border: 1px solid var(--line-ui); border-radius: 6px; }
.skip:focus { left: 16px; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
header h1 { font-size: 17px; margin: 0; font-weight: 700; }
header .sub { color: var(--muted); font-size: 12.5px; max-width: 420px; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
.btn, nav button, .pullsel button, .btns button, .crumbs button, .more { border: 1px solid var(--line-ui); background: transparent; color: var(--ink);
  padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
.btn:hover, nav button:hover, .pullsel button:hover, .btns button:hover, .crumbs button:hover, .more:hover { border-color: var(--accent); color: var(--accent); }
nav button[aria-current], .pullsel button[aria-current] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
  text-decoration: underline; text-underline-offset: 4px; }
button:disabled { opacity: .5; cursor: default; }
.pullsel { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: 12.5px; }
.search { flex: 1 1 240px; min-width: 180px; max-width: 460px; display: flex; flex-direction: column; gap: 2px; }
#q { width: 100%; padding: 6px 10px; border: 1px solid var(--line-ui); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit;
  -webkit-appearance: none; appearance: none; }
#q::placeholder { color: var(--muted); opacity: 1; }
#qnote { font-size: 12px; color: var(--muted); min-height: 1.2em; }
main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr) minmax(0, 1.15fr); }
main > section { overflow: auto; border-right: 1px solid var(--line); padding: 10px 16px; min-width: 0; }
main > section:last-child { border-right: 0; background: var(--panel); }
main.wide { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
main.single { grid-template-columns: minmax(0, 1fr); }
main.graphmode { grid-template-columns: minmax(0, 1.75fr) minmax(320px, 1fr); }
main.wide #left, main.graphmode #left, main.single #left, main.single #detail { display: none; }
@media (max-width: 900px) {
  header { position: static; }
  header .sub { display: none; }
  html, body { height: auto; }
  main, main.wide, main.graphmode, main.single { grid-template-columns: 1fr; min-height: auto; }
  main > section { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  #left { max-height: 40vh; overflow: auto; }
}
h2.kicker, h3.kicker { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
h2.kicker:first-child, h3.kicker:first-child { margin-top: 2px; }
h2.item { font-size: 18px; margin: 2px 0 4px; overflow-wrap: anywhere; }
.list { list-style: none; margin: 0; padding: 0; }
.row { width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 6px 8px; border-radius: 6px;
  cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.row:hover { background: var(--accent-soft); }
.row[aria-current] { background: var(--accent-soft); outline: 1px solid var(--accent); }
.row .name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
.row .lbl { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 140px; min-width: 0; }
.row .n { color: var(--muted); font-size: 12.5px; margin-left: auto; white-space: nowrap; }
.section-head { margin: 12px 0 4px 8px; font-size: 12.5px; color: var(--accent); font-weight: 600; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--chip); font-size: 12.5px; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.desc { color: var(--muted); font-style: italic; }
.label { white-space: pre-wrap; margin: 6px 0 10px; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 6px 0; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
.row .name.plain { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13.5px; }   /* a readable section title, not a code */
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); padding: 8px; border-radius: 6px; font-size: 13px; max-height: 320px; overflow: auto; }
.link { border: 0; background: none; padding: 4px 0; margin: -4px 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.muted { color: var(--muted); } .note { color: var(--muted); font-size: 13px; }
.banner { background: var(--accent-soft); border-radius: 6px; padding: 6px 10px; font-size: 13px; margin: 0 0 8px; }
.welcome { margin: 2px 0 12px; } .welcome h2 { font-size: 21px; margin: 0 0 4px; font-weight: 700; } .welcome p { margin: 0; color: var(--muted); font-size: 14px; max-width: 760px; }
.empty { color: var(--muted); padding: 24px 8px; }
.more { margin: 8px; }
select { font: inherit; padding: 4px 6px; border: 1px solid var(--line-ui); border-radius: 6px; background: var(--bg); color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 8px; align-items: center; }
details summary { cursor: pointer; color: var(--accent); margin: 6px 0; padding: 4px 0; }
.stat { display: inline-block; margin: 0 14px 8px 0; } .stat b { font-size: 19px; display: block; font-variant-numeric: tabular-nums; }
/* the picture area (network and map share the controls) */
#mid.graphwrap { display: flex; flex-direction: column; padding: 8px 16px; overflow: hidden; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.crumbs button { border-radius: 16px; padding: 4px 12px; font-size: 13.5px; background: var(--pill); }
.crumbs button[aria-current] { border-color: var(--hue, var(--accent)); box-shadow: inset 0 0 0 1px var(--hue, var(--accent)); color: var(--ink); }
.crumbs .sep { color: var(--muted); }
.crumbs .up { margin-left: auto; }
.ctl { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.ctl label { display: inline-flex; gap: 6px; align-items: center; }
.legend { display: inline-flex; flex-wrap: wrap; gap: 10px; align-items: center; list-style: none; margin: 0; padding: 0; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.bar { display: flex; gap: 2px; height: 10px; border-radius: 3px; overflow: hidden; background: var(--panel); margin: 4px 0 2px; }
.bar span { display: block; height: 100%; flex: 1 1 0; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.netscroll { flex: 1; overflow: auto; }
.net { position: relative; padding: 4px 4px 24px; }
.net svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.net svg path { fill: none; stroke: var(--edge); stroke-width: 1.2; }
.root { display: flex; justify-content: center; margin: 4px 0 42px; }
.pills { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px 22px; justify-items: center; list-style: none; margin: 0; padding: 0; }
.pill { position: relative; width: 100%; max-width: 340px; border: 1px solid var(--line-ui); border-left: 5px solid var(--hue, var(--line-ui));
  background: var(--pill); color: var(--ink); border-radius: 14px; padding: 9px 14px 14px; cursor: pointer; text-align: left; font: inherit; overflow: hidden; }
.pill.hued { background: color-mix(in srgb, var(--hue) var(--tint), var(--pill)); }
.pill:hover { border-color: var(--accent); }
.pill.top { max-width: 560px; font-size: 16px; text-align: center; border-left-width: 1px; border-top: 5px solid var(--hue, var(--line-ui)); cursor: default; }
.pill .nm { font-weight: 650; overflow-wrap: anywhere; }
.pill .nm.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.pill .qt { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.pill .cl { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.mix { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; display: flex; gap: 2px; background: var(--panel); }
.mix span { display: block; height: 100%; flex: 1 1 0; }
.netnote { color: var(--muted); font-size: 13px; margin-top: 18px; }
#map { position: relative; flex: 1; min-height: 360px; border-radius: 6px; overflow: hidden; background: var(--line); }
.tile { position: absolute; overflow: hidden; cursor: pointer; border: 1px solid var(--bg); border-radius: 3px; color: var(--ink); background: var(--pill); padding: 0; font: inherit; text-align: left; }
.tile.hued { background: color-mix(in srgb, var(--hue) var(--tint-strong), var(--pill)); }
.tile:hover { outline: 2px solid var(--accent); z-index: 1; }
.tile .tl { position: absolute; left: 3px; top: 3px; max-width: calc(100% - 6px); padding: 2px 5px; font-size: 12.5px; line-height: 1.25; border-radius: 3px;
  background: color-mix(in srgb, var(--panel) 84%, transparent); pointer-events: none; }
.tile .tl b { font-weight: 650; overflow-wrap: anywhere; }
.tile .tl .q { display: block; color: var(--muted); }
.tile .mix { height: 6px; }
.tile .sub { position: absolute; border: 1px solid color-mix(in srgb, var(--panel) 55%, transparent); pointer-events: none; }
.unlabelled { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
@media (forced-colors: active) {
  .mix, .mix span, .bar span, .sw, .tile { forced-color-adjust: none; }
  .tile { outline: 1px solid CanvasText; }
  nav button[aria-current], .pullsel button[aria-current], .crumbs button[aria-current], .row[aria-current] { outline: 2px solid CanvasText; outline-offset: -2px; }
}
</style>
</head>
<body>
<a class="skip" href="#mid">Skip to the content</a>
<header>
  <div><h1>NCS Catalog Explorer</h1>
    <div class="sub">Click a topic to open it; the panel on the right lists what is inside and copies the variable names. Survey questions and variable names only.</div></div>
  <div class="pullsel" id="pulls">data as of <span class="muted">loading…</span></div>
  <nav id="tabs" aria-label="Views"></nav>
  <div class="search">
    <label for="q" class="sr-only">Search variable names, question text, survey sections, topics and answer options</label>
    <input id="q" type="search" autocomplete="off" placeholder="Search names, questions, sections and answers" disabled>
    <div id="qnote" aria-hidden="true"></div>
  </div>
  <div id="status" role="status" class="sr-only"></div>
</header>
<main id="main" class="single">
  <section id="left" aria-label="Survey sections"></section>
  <section id="mid" aria-label="Content" tabindex="-1"><p class="empty" id="loading">Loading the variable list (about 3 MB)…</p></section>
  <section id="detail" aria-label="Details" tabindex="-1"></section>
</main>
<script>
"use strict";
// the data arrives in parts: data/ncs_graph.js says how many, data/ncs_graph_<n>.js hold them; load them, merge, start
function loadScript(src) {
  return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("could not load " + src)); document.head.append(s); });
}
async function loadGraph() {
  await loadScript("data/ncs_graph.js");
  const n = window.NCS_GRAPH_PARTS || 0;
  await Promise.all(Array.from({ length: n }, (_, i) => loadScript(`data/ncs_graph_${i + 1}.js`)));
  const chunks = window.NCS_GRAPH_CHUNKS || [];
  if (!n || chunks.length !== n) throw new Error(`expected ${n} data parts, got ${chunks.length}`);
  return chunks.reduce((g, c) => ({ meta: c.meta || g.meta, edges: g.edges.concat(c.edges || []), nodes: Object.assign(g.nodes, c.nodes || {}) }),
    { meta: null, edges: [], nodes: {} });
}
function showLoadError(why) {
  const mid = document.getElementById("mid");
  const local = location.protocol === "file:";
  const p = document.createElement("div"); p.className = "empty";
  p.textContent = local ? "No data yet. Build it first: python3 explorer/build_ncs_graph.py (needs an AWS login), then reload this page."
    : "The variable list did not load. Check your connection and reload the page.";
  const b = document.createElement("button"); b.className = "btn"; b.textContent = "Reload"; b.addEventListener("click", () => location.reload());
  const d = document.createElement("div"); d.className = "note"; d.textContent = why || "";
  mid.replaceChildren(p, b, d);
}
loadGraph().then((G) => { try { startExplorer(G); } catch (e) { showLoadError(String(e && e.message || e)); } },
                 (e) => showLoadError(String(e && e.message || e)));

function startExplorer(G) {
const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "onclick") e.addEventListener("click", v); else if (k === "class") e.className = v; else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false && k !== "") e.append(k instanceof Node ? k : String(k));
  return e;   // every string goes in as text, never as HTML
}
if (!G || !G.meta) throw new Error("the data has no header");

// ---- plain-language labels (the data keeps short codes; the page never shows them) ---------------------------------------
const STATUS = { is_field: ["a survey question", "ok"], checkbox_option: ["one option of a check-all-that-apply question", "ok"],
  form_status: ["when a section was done, or whether it was finished", "ok"], redcap_system: ["survey software record-keeping", "ok"],
  unresolved: ["not found in the codebook", "bad"], pipeline: ["added during cleaning", ""] };
const FATE = { cleaned: ["in the cleaned data", "ok"], not_in_cleaned: ["not in the cleaned data", "warn"], removed_pii: ["removed: identifying information", "bad"] };
const FATE_WHY = { cleaned: "in the cleaned data that researchers receive", not_in_cleaned: "kept in the raw data but left out of the cleaned data (typed-in answers, hidden or calculated fields, and other text)",
  removed_pii: "removed before anything else because it could identify a person (names, contact details)" };
const FATE_COLOR = { cleaned: "var(--f-cleaned)", not_in_cleaned: "var(--f-dropped)", removed_pii: "var(--f-pii)" };
const GROUPS = { topic: "topic", instrument: "survey section", fate: "in the cleaned data or not", harmonized: "shared across studies or not", status: "where it comes from" };
const SHOW = { all: "all variables", cleaned: "only variables in the cleaned data", not_cleaned: "only variables not in the cleaned data", removed: "only removed variables" };
const PSEUDO = { redcap_system: "Survey software record-keeping", unresolved: "Not found in the codebook", pipeline: "Scores and derived variables" };
const NO_QUESTIONS = "Pages with no questions";
const chip = (map, key, title) => key ? el("span", { class: "chip " + ((map[key] || [])[1] || ""), title: title || null }, (map[key] || [key])[0]) : "";
const fateChip = (key) => chip(FATE, key, FATE_WHY[key]);
const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : many || one + "s"}`;
const dl = (b) => `data as of ${b}`;
const across = (c) => !c.across_pulls ? "" : c.across_pulls === "agree" ? "in the same survey section in both data sets"
  : c.across_pulls === "instrument_changed" ? "in a different survey section in each data set" : "only in the " + dl(c.across_pulls.replace("only_", ""));
// survey-software idioms inside question text and logic, shown in plain words
const tidy = (s) => { const t = String(s || "").replace(/\s*\[[A-Za-z0-9_:\-().]+\]/g, "").replace(/\s*\{[A-Za-z0-9_:\-]+\}/g, "").replace(/\s+/g, " ").trim(); return t || String(s || ""); };
const IDIOMS = [[/-888/g, "-888 (the 'Other' choice)"], [/@HIDDEN-SURVEY/g, "hidden from the participant"], [/@HIDDEN/g, "hidden"], [/@CALCTEXT/g, "calculated by the survey software"]];
const humanize = (s) => IDIOMS.reduce((t, [re, w]) => t.replace(re, w), String(s || ""));
const FORMAT = { integer: "whole number", number: "number", number_1dp: "number", number_2dp: "number", date_mdy: "date", date_ymd: "date", date_dmy: "date",
  datetime_mdy: "date and time", datetime_ymd: "date and time", datetime_seconds_mdy: "date and time", datetime_seconds_ymd: "date and time",
  email: "email address", phone: "phone number", zipcode: "ZIP code", time: "time", autocomplete: "" };

// ---- indexes -------------------------------------------------------------------------------------------------------------
const N = G.nodes, PULLS = G.meta.pulls.slice();
const fields = {}, insts = {}, colsOf = {}, colsByField = {}, colsByInst = {}, mapped = {}, topicsOf = {}, instOrder = {}, hasQuestions = {}, addedBy = {};
for (const b of PULLS) { fields[b] = {}; colsOf[b] = []; colsByField[b] = {}; colsByInst[b] = {}; instOrder[b] = {}; hasQuestions[b] = new Set(); addedBy[b] = 0; }
for (const n of Object.values(N)) {
  if (n.kind === "field") {
    const shown = tidy(n.label);
    if (shown !== n.label && !n.label_source) n.label_source = n.label;
    n.label = shown;
    if (n.choices) n.choices = n.choices.map(([code, label]) => [code, tidy(label)]);
    fields[n.batch][n.name] = n;
  } else if (n.kind === "column") {
    for (const [b, r] of Object.entries(n.pulls)) {
      if (!colsOf[b]) continue;
      if (r.option) r.option = [r.option[0], tidy(r.option[1])];
      colsOf[b].push(n);
      if (r.field) (colsByField[b][r.field] = colsByField[b][r.field] || []).push(n);
      if (r.instrument) (colsByInst[b][r.instrument] = colsByInst[b][r.instrument] || []).push(n);
      if (r.status === "is_field" || r.status === "checkbox_option") hasQuestions[b].add(r.instrument);
      if (r.status === "pipeline") addedBy[b]++;
    }
  }
}
for (const b of PULLS) {
  insts[b] = Object.values(N).filter((n) => n.kind === "instrument" && n.pulls[b]).sort((x, y) => x.pulls[b].order - y.pulls[b].order);
  for (const i of insts[b]) instOrder[b][i.name] = new Map(i.pulls[b].fields.map((f, k) => [f, k]));

    el("h2", { class: "kicker" }, "Files used"), src,
  ];
}

// ---- detail ----------------------------------------------------------------------------------------------------------------
function kv(pairs) { const d = el("dl"); for (const [k, v] of pairs) if (v) d.append(el("dt", {}, k), el("dd", {}, v)); return d; }
function sourceNote(keys) { return el("details", { class: "note" }, el("summary", {}, "source files"), ...keys.map((k) => el("div", { class: "mono" }, (G.meta.sources[k] || {}).file || k))); }
function fieldDetail(name) {
  const f = fields[S.pull][name];
  if (!f) return [el("div", { class: "empty" }, `${name} is not in the codebook for the ${dl(S.pull)}.`)];
  const cols = colsByField[S.pull][name] || [];
  const out = [el("div", { class: "muted" }, "survey question"), el("h2", { class: "item" }, f.name),
    el("div", {}, "survey section ", el("button", { class: "link", onclick: () => go({ tab: "instruments", inst: f.form }, { focus: "#mid" }) }, titleOf(f.form)), titleOf(f.form) !== f.form ? el("span", { class: "muted mono" }, " " + f.form) : "",
      f.identifier === "y" ? el("span", { class: "chip bad" }, "identifying information") : ""),
    el("div", { class: "label" }, f.label || "(no text)")];
  if (f.label_source) out.push(el("details", {}, el("summary", {}, "question text exactly as stored in the codebook"), el("pre", {}, f.label_source)));
  out.push(kv([["heading", f.section], ["note", f.note], ["answer format", f.validation in FORMAT ? FORMAT[f.validation] : f.validation]]));
  if (f.choices && f.choices.length) {
    out.push(el("h3", { class: "kicker" }, `${f.choices.length} answer options${f.type === "checkbox" ? " (check all that apply)" : ""}`));
    const cb = f.type === "checkbox";
    const t = el("table", {}, el("tr", {}, el("th", {}, "code"), el("th", {}, "answer"), cb ? el("th", {}, "variable") : null, cb ? el("th", {}, "in the cleaned data?") : null));
    for (const [code, label] of f.choices) {
      const col = cb ? cols.find((c) => (c.pulls[S.pull].option || [])[0] === code) : null;
      t.append(el("tr", {}, el("td", { class: "mono" }, code), el("td", {}, label),
        cb ? el("td", { class: "mono" }, col ? el("button", { class: "link", onclick: () => go({ sel: { type: "column", name: col.name } }, { focus: "#detail" }) }, col.name) : el("span", { class: "chip bad" }, "no variable")) : null,
        cb ? el("td", {}, col ? fateChip(col.pulls[S.pull].fate) : "") : null));
    }
    out.push(t);
  }
  for (const [k, t] of [["branching", "asked only when"], ["calculation", "calculated as"], ["annotation", "survey software notes"]])
    if (f[k]) out.push(el("h3", { class: "kicker" }, t), el("pre", {}, humanize(f[k])));
  if (f.type !== "checkbox" && cols.length) { out.push(el("h3", { class: "kicker" }, plural(cols.length, "variable"))); const ul = el("ul", { class: "list" }); cols.forEach((c) => ul.append(el("li", {}, varRow(c)))); out.push(ul); }
  const shares = cols.flatMap((c) => (mapped[c.name] || []).map((m) => [c.name, m[0]]));
  if (shares.length) out.push(el("h3", { class: "kicker" }, "shared across studies as"), el("table", {}, ...shares.map(([c, can]) => el("tr", {}, el("td", { class: "mono" }, c), el("td", {}, can)))));
  const elsewhere = PULLS.filter((b) => b !== S.pull && fields[b][name]);
  if (elsewhere.length) {
    out.push(el("h3", { class: "kicker" }, "in the other data set"));
    const ul = el("ul", { class: "list" });
    for (const b of elsewhere) {
      const o = fields[b][name], diffs = [];
      if (o.form !== f.form) diffs.push(`in survey section ${titleOf(o.form)}`);
      if (o.type !== f.type) diffs.push("asked differently");
      if ((o.label_source || o.label) !== (f.label_source || f.label)) diffs.push("worded differently");
      if (JSON.stringify(o.choices) !== JSON.stringify(f.choices)) diffs.push("different answer options");
      ul.append(el("li", {}, el("button", { class: "row", onclick: () => go({ pull: b }, { focus: "#detail" }) }, el("span", { class: "name" }, b), el("span", { class: "lbl" }, diffs.length ? diffs.join(" · ") : "same wording and answer options"))));
    }
    out.push(ul);
  }
  out.push(sourceNote(["dictionary@" + S.pull]));
  return out;
}
function columnDetail(name) {
  const c = N["column:" + name];
  if (!c) return [el("div", { class: "empty" }, `No variable called ${name}.`)];
  const out = [el("div", { class: "muted" }, c.added_by_pipeline ? "variable added during cleaning" : "variable"), el("h2", { class: "item" }, c.name)];
  const r0 = c.pulls[S.pull];
  if (r0) out.push(el("div", {}, fateChip(r0.fate), " ", el("span", { class: "note" }, FATE_WHY[r0.fate])));
  if (r0 && r0.field && fields[S.pull][r0.field]) out.push(el("div", { class: "label" }, (r0.option ? r0.option[1] + " — one option of: " : "") + fields[S.pull][r0.field].label));
  const fates = PULLS.map((b) => c.pulls[b] && c.pulls[b].fate).filter(Boolean);
  if (new Set(fates).size > 1) out.push(el("div", { class: "banner" }, "Its status differs between the data sets: " + PULLS.filter((b) => c.pulls[b]).map((b) => `${FATE[c.pulls[b].fate][0]} as of ${b}`).join("; ") + "."));
  if (across(c)) out.push(el("div", { class: "note" }, across(c)));
  for (const b of PULLS) {
    const r = c.pulls[b];
    out.push(el("h3", { class: "kicker" }, dl(b)));
    if (!r) { out.push(el("div", { class: "note" }, "not in this data set")); continue; }
    out.push(kv([["in the cleaned data?", fateChip(r.fate)], ["comes from", el("span", {}, chip(STATUS, r.status), r.option ? ` — option: ${r.option[1]}` : "")],
      ["question", r.field ? el("button", { class: "link mono", onclick: () => go({ pull: b, sel: { type: "field", name: r.field } }, { focus: "#detail" }) }, r.field) : ""],
      ["survey section", r.instrument ? el("button", { class: "link", onclick: () => go({ pull: b, tab: "instruments", inst: r.instrument }, { focus: "#mid" }) }, titleOf(r.instrument)) : ""],
      ["why unresolved", r.reason || ""]]));
  }
  if (mapped[name]) out.push(el("h3", { class: "kicker" }, "shared across studies as"), el("div", {}, mapped[name].map((m) => m[0]).join(", ")));
  out.push(sourceNote(["export@" + S.pull].concat(mapped[name] ? ["column_mappings"] : [])));
  return out;
}

// ---- render ----------------------------------------------------------------------------------------------------------------
function render() {
  renderHeader();
  if ($("q").value !== S.q) $("q").value = S.q;
  const graph = S.tab === "network" || S.tab === "map";
  const back = el("div", {}, el("button", { class: "link", onclick: () => go({ sel: null }, { focus: ".pill.top, #map" }) }, "← back to the group"));
  let count = null;
  if (graph) {
    $("main").className = "graphmode";
    settlePath();
    const { root, node, missing } = S.tab === "network" ? renderNetwork() : renderMap();
    count = root.n;
    $("detail").replaceChildren(...(!S.sel ? groupPanel(root, node, missing) : [back, ...(S.sel.type === "field" ? fieldDetail(S.sel.name) : columnDetail(S.sel.name))]));
  } else {
    $("mid").className = "";
    const listTab = S.tab === "instruments" || S.tab === "columns";
    $("main").className = S.tab === "instruments" ? "" : (S.sel ? "wide" : "single");
    if (S.tab === "instruments") renderLeft();
    const mid = S.tab === "instruments" ? renderInstrument() : S.tab === "columns" ? renderColumns() : S.tab === "review" ? renderReview() : renderAbout();
    if (S.q && !listTab) mid.unshift(el("div", { class: "banner" }, `The search box applies to the Network, Map, Survey sections and Variables views.`));
    $("mid").replaceChildren(...mid);
    $("detail").replaceChildren(...(!S.sel ? [el("div", { class: "empty" }, "Pick a question or variable to see where it comes from and whether it is in the cleaned data.")]
      : S.sel.type === "field" ? fieldDetail(S.sel.name) : columnDetail(S.sel.name)));
    if (S.tab === "columns") count = colsOf[S.pull].filter((c) => matches(c._hay[S.pull], words(S.q))).length;
  }
  $("qnote").textContent = S.q && count !== null ? `${plural(count, "variable")} match` : "";
  $("status").textContent = S.q ? (count === null ? "" : `${plural(count, "variable")} match “${S.q}”`) : "";
  document.title = (S.sel ? S.sel.name + " · " : "") + "NCS Catalog Explorer";
  if (focusNext) {
    const t = document.querySelector(focusNext);
    if (t) { if (t.tabIndex < 0 && !t.hasAttribute("tabindex")) t.tabIndex = -1; t.focus({ preventScroll: false }); }
    focusNext = null;
  }
}
let timer = null, resizeTimer = null;
$("q").addEventListener("input", (e) => { const v = e.target.value; clearTimeout(timer); timer = setTimeout(() => go({ q: v.trim(), all: false }, { replace: true }), 180); });
const onNavigate = () => { if (location.hash === written) return; stale = null; readHash(); writeHash(true); render(); };
window.addEventListener("hashchange", onNavigate);
window.addEventListener("popstate", onNavigate);
window.addEventListener("resize", () => { if (S.tab !== "map" && S.tab !== "network") return; clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || (S.tab !== "map" && S.tab !== "network") || e.target === $("q")) return;
  if (S.sel) go({ sel: null }, { focus: ".pill.top, #map" });
  else if (S.path.length) { const { node } = resolve(getTree()); const p = up(node); if (p) go({ path: pathOf(p), all: false }, { focus: ".pill.top, #map" }); }
});
const typedEarly = $("q").value.trim();
readHash();
if (typedEarly && !S.q) S.q = typedEarly;
if (!S.inst && insts[S.pull].length) S.inst = insts[S.pull][0].name;
$("q").disabled = false;
writeHash(true);                          // normalises a partial address; leaves the bare address bare
render();
}
